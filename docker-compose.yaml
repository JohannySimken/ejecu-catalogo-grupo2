name: ejecu-catalogo-grupo2
services:
  postgres:
    image: postgres:17.11@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Completar .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Completar .env}
      POSTGRES_DB: ${POSTGRES_DB:?Completar .env}
    volumes: [datos:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.migrate
    environment:
      GOOSE_DBSTRING: ${DATABASE_URL:?Completar .env}
    depends_on:
      postgres: { condition: service_healthy }
  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    ports: ['127.0.0.1:${BACKEND_PORT:-5121}:8080']
    depends_on:
      migrate: { condition: service_completed_successfully }
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      BACKEND_URL: http://backend:8080
    ports: ['127.0.0.1:${WEB_PORT:-5120}:8080']
    depends_on: [backend]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
  mailpit:
    image: axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    profiles: [dev]
    ports: ['127.0.0.1:8025:8025']
volumes:
  datos:
